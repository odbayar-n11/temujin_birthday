<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy 18th, Temuujin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Abril+Fatface&family=Bungee&family=Alfa+Slab+One&family=Playfair+Display:wght@900&family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fbf6ec;
    --pink:#f2b8c6;
    --pink-deep:#e58fa6;
    --denim:#8faccc;
    --ink:#3a2f2f;
    --gold:#e2b84b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Comfortaa',system-ui,sans-serif;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

  /* ---------------- SCREEN 1 : GIFT ---------------- */
  #giftScreen{
    position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:
      radial-gradient(circle at 1px 1px, rgba(229,143,166,.35) 1.5px, transparent 0) 0 0/22px 22px,
      var(--cream);
    transition:opacity .8s ease, visibility .8s;
    padding:16px;
  }
  #giftScreen.gone{opacity:0;visibility:hidden}
  .gift-hint{
    font-family:'Caveat',cursive;font-size:clamp(26px,6vw,40px);color:#6b8f4e;text-align:center;
    animation:float 2.4s ease-in-out infinite;
  }
  .gift-sub{font-size:14px;color:#9b8a7a;letter-spacing:.06em}
  #gift{
    width:min(72vw,340px);aspect-ratio:1;cursor:pointer;border:none;background:none;
    position:relative;
    animation:wobble 2.2s ease-in-out infinite;
  }
  #gift img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;display:block;pointer-events:none}
  #gift.shake{animation:shake .6s ease-in-out}
  #gift.pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1) forwards}
  @keyframes wobble{0%,100%{transform:rotate(0) scale(1)}10%{transform:rotate(-4deg) scale(1.02)}20%{transform:rotate(4deg)}30%{transform:rotate(0)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-6deg)}40%{transform:translateX(10px) rotate(6deg)}60%{transform:translateX(-8px) rotate(-4deg)}80%{transform:translateX(8px) rotate(4deg)}}
  @keyframes pop{0%{transform:scale(1);opacity:1}40%{transform:scale(1.25)}100%{transform:scale(2.6);opacity:0}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  /* ---------------- SCREEN 2 : COLLAGE ---------------- */
  #reveal{display:none}
  #reveal.show{display:block}
  .collage{
    position:relative;min-height:100vh;min-height:100svh;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;padding:60px 16px 90px;
  }
  /* denim left half */
  .collage::before{
    content:"";position:absolute;inset:0 36% 0 0;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.18) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(-45deg, rgba(40,70,110,.18) 0 1px, transparent 1px 3px),
      radial-gradient(circle at 30% 20%, #a3bdd9, #86a3c4 60%, #7d9abb);
  }
  /* pink plaid right side */
  .collage::after{
    content:"";position:absolute;inset:0 0 0 64%;
    background:
      repeating-linear-gradient(90deg, rgba(242,170,190,.55) 0 18px, transparent 18px 26px, rgba(242,170,190,.55) 26px 30px, transparent 30px 48px),
      repeating-linear-gradient(0deg, rgba(242,170,190,.55) 0 18px, transparent 18px 26px, rgba(170,200,230,.45) 26px 28px, transparent 28px 48px),
      #fdf3e1;
  }
  .card{
    position:relative;z-index:2;width:min(86vw,400px);
    opacity:0;transform:scale(.4) rotate(-8deg);
  }
  #reveal.show .card{animation:cardIn .9s cubic-bezier(.25,1.5,.5,1) .15s forwards}
  @keyframes cardIn{to{opacity:1;transform:scale(1) rotate(0)}}

  .photo-wrap{position:relative;width:78%;margin:0 auto;margin-top:34%}
  .photo{
    display:block;width:100%;aspect-ratio:560/700;object-fit:cover;object-position:30% 0;
    filter:grayscale(1) contrast(1.08) brightness(1.04);
    border:7px solid #fff;border-radius:46% 46% 14px 14px / 28% 28% 14px 14px;
    box-shadow:0 10px 24px rgba(30,40,60,.28);
  }
  /* party hat */
  .hat{
    position:absolute;z-index:2;width:44%;left:27%;top:-27%;
    transform:rotate(-12deg);transform-origin:50% 100%;
    filter:drop-shadow(0 4px 4px rgba(0,0,0,.25));
    animation:hatBob 3s ease-in-out infinite;
  }
  @keyframes hatBob{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(-8deg) translateY(-3px)}}

  .tag{
    position:absolute;left:-6%;top:6%;z-index:3;
    font-family:'Caveat',cursive;font-weight:700;color:#b8343d;font-size:clamp(20px,5vw,26px);line-height:.95;
    background:#f6e7d4;padding:6px 12px 8px;border-radius:3px;transform:rotate(-24deg);
    box-shadow:0 3px 8px rgba(0,0,0,.18);border:1.5px solid #fff;
  }
  .num{
    position:absolute;z-index:3;font-family:'Bungee',sans-serif;font-size:clamp(34px,9vw,46px);
    -webkit-text-stroke:2px #fff;paint-order:stroke fill;text-shadow:0 2px 6px rgba(0,0,0,.2);
  }
  .num.one{left:2%;top:46%;color:#f2a7bd;transform:rotate(-10deg)}
  .num.eight{right:0%;top:44%;color:#a891d6;transform:rotate(12deg)}
  .sticker-star{position:absolute;z-index:3;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
  .sticker-star.red{width:13%;right:16%;top:28%;transform:rotate(14deg)}
  .sticker-star.g1{width:17%;left:-4%;bottom:6%;transform:rotate(-12deg)}
  .sticker-star.g2{width:17%;right:-4%;bottom:6%;transform:rotate(14deg)}

  .letters{position:relative;z-index:4;margin-top:-22%;display:flex;flex-direction:column;align-items:center;gap:4px}
  .row{display:flex;justify-content:center;gap:2px;flex-wrap:nowrap}
  .l{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:clamp(30px,8.4vw,40px);height:clamp(40px,11vw,52px);padding:0 4px;
    font-size:clamp(26px,7.4vw,36px);line-height:1;
    box-shadow:0 3px 5px rgba(0,0,0,.25);border:2px solid #fff;
    opacity:0;transform:translateY(-30px) rotate(0);
  }
  #reveal.show .l{animation:drop .5s cubic-bezier(.3,1.7,.5,1) forwards}
  @keyframes drop{to{opacity:1;transform:translateY(0) rotate(var(--r))}}

  .name{
    position:relative;z-index:4;text-align:center;margin-top:14px;
    font-family:'Caveat',cursive;font-weight:700;font-size:clamp(40px,11vw,58px);color:#fff;
    text-shadow:0 2px 0 var(--pink-deep),0 4px 10px rgba(0,0,0,.25);
    opacity:0;
  }
  #reveal.show .name{animation:fadeUp .8s ease 2s forwards}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .scroll-cue{
    position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:3;
    background:#fff;border:none;border-radius:999px;padding:10px 18px;
    font-family:'Comfortaa',sans-serif;font-weight:700;font-size:14px;color:var(--ink);
    box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer;opacity:0;
  }
  #reveal.show .scroll-cue{animation:cueIn .8s ease 2.6s forwards, cueFloat 2s ease-in-out 3.4s infinite}
  @keyframes cueIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes cueFloat{0%,100%{opacity:1;transform:translate(-50%,0)}50%{opacity:1;transform:translate(-50%,-6px)}}

  /* ---------------- SECTION 3 : CAKE ---------------- */
  .cake-section{
    min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;padding:60px 16px;text-align:center;
    background:linear-gradient(#fbf6ec, #fde8ee);
    position:relative;overflow:hidden;
    transition:background 1s;
  }
  .cake-section.dark{background:linear-gradient(#2b2440,#3d2f52)}
  .cake-section.dark .caption{color:#fde8ee}
  .caption{
    font-family:'Caveat',cursive;font-weight:700;font-size:clamp(32px,8vw,48px);color:#c45b7a;
    transition:color 1s;min-height:1.2em;
  }
  .hint{font-size:13px;color:#a3929a;letter-spacing:.05em}
  .cake-section.dark .hint{color:#b9a9c9}

  #cake{
    position:relative;width:min(80vw,320px);cursor:pointer;background:none;border:none;
    padding-top:120px;
  }
  .plate{height:16px;width:116%;margin-left:-8%;background:#fff;border-radius:50%;box-shadow:0 6px 0 #e6dccf, 0 14px 20px rgba(0,0,0,.12)}
  .tier{position:relative;margin:0 auto;border-radius:14px 14px 8px 8px}
  .tier.bottom{width:100%;height:100px;background:linear-gradient(#f7c6d3,#eea7bb)}
  .tier.top{width:72%;height:80px;background:linear-gradient(#fff8ee,#f4e6d2);margin-bottom:-4px}
  .tier::before{ /* drip frosting */
    content:"";position:absolute;left:0;right:0;top:0;height:26px;border-radius:14px 14px 0 0;
    background:
      radial-gradient(circle at 10px 16px, var(--f) 10px, transparent 11px) 0 0/30px 30px repeat-x,
      linear-gradient(var(--f),var(--f)) 0 0/100% 12px no-repeat;
  }
  .tier.bottom{--f:#fff}
  .tier.top{--f:#f2a7bd}
  .tier .sprinkles{position:absolute;inset:30px 10px 8px;pointer-events:none}
  .tier .sprinkles i{position:absolute;width:8px;height:3px;border-radius:2px}

  .candles{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;gap:6px;align-items:flex-end;height:124px}
  .candle{
    position:relative;font-family:'Bungee',sans-serif;font-size:78px;line-height:1;
    color:#f6c1cf;-webkit-text-stroke:3px #fff;paint-order:stroke fill;
    text-shadow:0 3px 0 #e58fa6;
  }
  .candle.b{color:#bfd6ee;text-shadow:0 3px 0 #8faccc}
  .wick{position:absolute;left:50%;top:-12px;width:3px;height:14px;background:#4a3a2a;transform:translateX(-50%);border-radius:2px}
  .flame{
    position:absolute;left:50%;top:-44px;width:18px;height:32px;margin-left:-9px;
    background:radial-gradient(ellipse at 50% 75%, #fff9d6 0 25%, #ffd257 45%, #ff8a2a 80%, transparent 82%);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    transform-origin:50% 100%;
    animation:flicker .12s ease-in-out infinite alternate;
    box-shadow:0 0 22px 8px rgba(255,190,80,.45);
    transition:opacity .25s, transform .25s;
  }
  @keyframes flicker{from{transform:rotate(-3deg) scaleY(1)}to{transform:rotate(3deg) scaleY(1.08)}}
  .out .flame{opacity:0;transform:scale(.2) translateY(10px);animation:none}
  .smoke{
    position:absolute;left:50%;top:-30px;width:10px;height:10px;margin-left:-5px;border-radius:50%;
    background:rgba(190,190,200,.7);opacity:0;pointer-events:none;
  }
  .out .smoke{animation:smoke 2.2s ease-out forwards}
  .out .smoke:nth-child(4){animation-delay:.2s}
  .out .smoke:nth-child(5){animation-delay:.4s}
  @keyframes smoke{0%{opacity:.8;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx,8px),-90px) scale(4)}}

  .wish{
    font-size:clamp(15px,4vw,18px);line-height:1.7;max-width:420px;color:#fde8ee;
    opacity:0;transform:translateY(10px);transition:opacity 1s .6s, transform 1s .6s;
  }
  .wish.show{opacity:1;transform:none}
  .wish b{font-family:'Caveat',cursive;font-size:1.6em;color:#f6c1cf}
  .relight{
    margin-top:4px;background:none;border:1.5px solid #b9a9c9;color:#d9cce6;border-radius:999px;
    padding:8px 16px;font-family:inherit;font-size:13px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1s 1.5s;
  }
  .relight.show{opacity:1;pointer-events:auto}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms!important;animation-iteration-count:1!important}
  }
</style>
</head>

    <div class="caption" id="caption">Хүслээ бодоод үлээгээрэй</div>
    <button id="cake" aria-label="Лаагаа үлээх">
      <div class="candles">
        <div class="candle">1<span class="wick"></span><span class="flame"></span><span class="smoke"></span><span class="smoke" style="--dx:-10px"></span><span class="smoke" style="--dx:14px"></span></div>
        <div class="candle b">8<span class="wick"></span><span class="flame"></span><span class="smoke"></span><span class="smoke" style="--dx:-10px"></span><span class="smoke" style="--dx:14px"></span></div>
      </div>
      <div class="tier top"><div class="sprinkles"></div></div>
      <div class="tier bottom"><div class="sprinkles"></div></div>
      <div class="plate"></div>
    </button>
    <div class="hint" id="hint">бялуун дээр дарж лаагаа үлээгээрэй</div>
    <p class="wish" id="wish"><b>Төрсөн өдрийн мэнд, Temuujin!</b><br>18 нас чинь хамгийн гоё, хамгийн аз жаргалтай жил болоосой. Бодсон хүсэл чинь биелэх болтугай ✨</p>
    <button class="relight" id="relight">лаагаа дахин асаах 🕯️</button>
  </section>
</main>

<script>
/* ---------- ransom-note letters ---------- */
const styles = [
  {bg:'#c8323c',c:'#fff3e6',f:'Abril Fatface'},
  {bg:'#1f1f1f',c:'#fff',f:'Alfa Slab One'},
  {bg:'#e6467a',c:'#fff',f:'Bungee'},
  {bg:'#fff8e6',c:'#4bb3d6',f:'Playfair Display'},
  {bg:'#8fb6b0',c:'#f6b73c',f:'Bungee'},
  {bg:'#efe8dc',c:'#1f1f1f',f:'Playfair Display'},
  {bg:'transparent',c:'#e07aa8',f:'Abril Fatface',noBox:1},
  {bg:'#f6c94a',c:'#7a4a1a',f:'Alfa Slab One'},
  {bg:'#7a1f2a',c:'#f6c1cf',f:'Playfair Display'},
  {bg:'#f3e04a',c:'#2d7a3e',f:'Bungee'},
  {bg:'#fff',c:'#1f1f1f',f:'Playfair Display'},
  {bg:'#3a3a3a',c:'#e9e9e9',f:'Alfa Slab One'},
  {bg:'#e04a4a',c:'#f3dede',f:'Bungee'},
];
function build(id, word, offset, delayStart){
  const row=document.getElementById(id);
  [...word].forEach((ch,i)=>{
    const s=styles[(i+offset)%styles.length];
    const el=document.createElement('span');
    el.className='l';
    el.textContent=ch;
    el.style.background=s.bg; el.style.color=s.c; el.style.fontFamily=`'${s.f}',serif`;
    if(s.noBox){el.style.boxShadow='none';el.style.border='none';}
    el.style.setProperty('--r', (Math.random()*12-6).toFixed(1)+'deg');
    el.style.animationDelay=(delayStart+i*0.08)+'s';
    row.appendChild(el);
  });
}
build('row1','HAPPY',0,0.9);
build('row2','BirtHdAY',5,1.3);

/* sprinkles */
const sprColors=['#e58fa6','#8faccc','#e2b84b','#a891d6','#7cc39a','#fff'];
document.querySelectorAll('.sprinkles').forEach(box=>{
  for(let i=0;i<22;i++){
    const s=document.createElement('i');
    s.style.left=Math.random()*94+'%'; s.style.top=Math.random()*84+'%';
    s.style.background=sprColors[i%sprColors.length];
    s.style.transform=`rotate(${Math.random()*180}deg)`;
    box.appendChild(s);
  }
});

/* ---------- confetti ---------- */
const cv=document.getElementById('confetti'), ctx=cv.getContext('2d');
let parts=[], running=false;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
size(); addEventListener('resize',size);
const cColors=['#f2a7bd','#e58fa6','#8faccc','#e2b84b','#a891d6','#7cc39a','#fff'];
function burst(x,y,n=160){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=4+Math.random()*9;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,w:6+Math.random()*6,h:4+Math.random()*5,
      r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cColors[i%cColors.length],life:0,star:Math.random()<.2});
  }
  if(!running){running=true;requestAnimationFrame(tick)}
}
function star(cx,cy,r){ctx.beginPath();for(let i=0;i<10;i++){const rr=i%2?r/2.2:r,a=i*Math.PI/5-Math.PI/2;ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}ctx.closePath();ctx.fill()}
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life<220 && p.y<innerHeight+40);
  parts.forEach(p=>{
    p.vy+=.22; p.vx*=.985; p.vy*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life++;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
    ctx.globalAlpha=Math.max(0,1-p.life/220);
    if(p.star) star(0,0,p.w*.8); else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.life*.1)));
    ctx.restore();
  });
  if(parts.length) requestAnimationFrame(tick); else {running=false;ctx.clearRect(0,0,innerWidth,innerHeight)}
}

/* ---------- gift open ---------- */
const gift=document.getElementById('gift'), giftScreen=document.getElementById('giftScreen'), reveal=document.getElementById('reveal');
let opened=false;
gift.addEventListener('click',()=>{
  if(opened) return; opened=true;
  gift.style.animation='none'; void gift.offsetWidth;
  gift.classList.add('shake');
  setTimeout(()=>{
    gift.classList.remove('shake'); gift.classList.add('pop');
    const r=gift.getBoundingClientRect();
    burst(r.left+r.width/2, r.top+r.height/2, 220);
    setTimeout(()=>{
      reveal.classList.add('show');
      giftScreen.classList.add('gone');
      window.scrollTo(0,0);
      setTimeout(()=>burst(innerWidth/2, innerHeight*.35, 140), 1900);
    },350);
  },600);
});

document.getElementById('toCake').addEventListener('click',()=>{
  document.getElementById('cakeSection').scrollIntoView({behavior:'smooth'});
});

/* ---------- cake ---------- */
const cake=document.getElementById('cake'), sec=document.getElementById('cakeSection'),
      caption=document.getElementById('caption'), hint=document.getElementById('hint'),
      wish=document.getElementById('wish'), relight=document.getElementById('relight');
let blown=false;
cake.addEventListener('click',()=>{
  if(blown) return; blown=true;
  cake.classList.add('out');
  setTimeout(()=>{
    sec.classList.add('dark');
    caption.textContent='Хүсэл чинь биелэх болтугай! 🎉';
    hint.style.visibility='hidden';
    wish.classList.add('show'); relight.classList.add('show');
    const r=cake.getBoundingClientRect();
    burst(r.left+r.width/2, r.top+40, 200);
    setTimeout(()=>burst(innerWidth*.2, innerHeight*.3, 90),400);
    setTimeout(()=>burst(innerWidth*.8, innerHeight*.3, 90),700);
  },500);
});
relight.addEventListener('click',()=>{
  blown=false; cake.classList.remove('out'); sec.classList.remove('dark');
  caption.textContent='Хүслээ бодоод үлээгээрэй'; hint.style.visibility='visible';
  wish.classList.remove('show'); relight.classList.remove('show');
});
</script>
</body>
</html>
